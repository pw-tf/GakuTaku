name: CI

# Every PR and every push to main: typecheck, logic checks and a web build, then the Android APK.
# On main the APK is published as a GitHub Release (install/update it with Obtainium).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck, verify, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify
      - run: npm run build

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    env:
      # versionCode only ever grows (run numbers do), so each release installs as an update.
      GAKUTAKU_VERSION_CODE: ${{ github.run_number }}
      GAKUTAKU_VERSION_NAME: 1.0.0-beta.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci

      # The dictionary (JMdict + JMnedict + KANJIDIC) is rebuilt from the latest jmdict-simplified
      # release and bundled into the APK; the built buckets are cached per upstream release.
      - name: Find dictionary release
        id: dict
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo scriptin/jmdict-simplified --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - name: Cache built dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: public/dict/jmdict
          key: jmdict-${{ steps.dict.outputs.tag }}-${{ hashFiles('scripts/build-dict.ts', 'src/dictionary/types.ts') }}
      - name: Build dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p dict-src
          gh release download "${{ steps.dict.outputs.tag }}" --repo scriptin/jmdict-simplified -D dict-src \
            --pattern 'jmdict-eng-[0-9]*.json.zip' \
            --pattern 'jmnedict-all-[0-9]*.json.zip' \
            --pattern 'kanjidic2-en-[0-9]*.json.zip'
          (cd dict-src && for f in *.zip; do unzip -o -q "$f"; done && ls -la)
          npm run build:dict
      - name: Dictionary size
        run: du -sh public/dict/jmdict && ls public/dict/jmdict/b | wc -l

      - name: Build web assets for Android
        run: npm run build:android

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building a debug-signed APK that cannot update a release install."
          fi

      - name: Build APK
        working-directory: android
        env:
          GAKUTAKU_KEYSTORE: ${{ steps.key.outputs.path }}
          GAKUTAKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$GAKUTAKU_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/GakuTaku.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/GakuTaku.apk"
          fi
          ls -la "$RUNNER_TEMP/GakuTaku.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GakuTaku-${{ env.GAKUTAKU_VERSION_NAME }}
          path: ${{ runner.temp }}/GakuTaku.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${GAKUTAKU_VERSION_NAME}" "$RUNNER_TEMP/GakuTaku.apk" \
            --title "GakuTaku 1.0.0 beta ${GITHUB_RUN_NUMBER}" \
            --notes "Beta build from ${GITHUB_SHA::7}. Installs as an update over any earlier beta (same signing key). Update with Obtainium, or download the APK." \
            --target "$GITHUB_SHA"
